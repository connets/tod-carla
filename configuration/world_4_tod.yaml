# =============================================================================
#  Town04 scene of DatagramTOD (tod-omnet/simulations/v2/datagram_tod.ini),
#  ego only; world_4_tod_bg.yaml adds the background traffic.
#
#  Every actor_id must match a mobility.carla_id in datagram_tod.ini.
# =============================================================================
world: Town04_Opt

new_vehicles:

# --- Teleoperated ego (VectorVehicle[0]) ---------------------------------------
- actor_id: Car01
  actor_type: Vehicle
  role_name: hero
  speed_limit: auto
  model: vehicle.tesla.model3
  camera:
    width: 1280
    height: 720
  renderCamera: false      # camera window with the HUD; false for measurement campaigns
  collision: true
  lidar: true

spectator:
  follow: Car01
  follow_distance: 8.0
  follow_height: 4.0
  follow_pitch: -12.0

fromOmnet_vehicles: []

agents:
- agentId: Agent01
  behavior: custom
  sampling_resolution: 0.5
  time_limit: 300
  actor_id_to_control: Car01
  collision_calculation_method: CARLADEFAULT
  ignoreIds: []

  loss_ratio_threshold: 0.5   # sensor loss that triggers the emergency stop (the ini can override it)
  control_timeout: 0.5        # seconds without instructions before the minimum risk maneuver
  route_loop: true            # restart the route instead of ending the simulation
  control_period: 0.033       # must equal todCarApp.statusUpdateInterval in the ini

  # respecting traffic lights stops the ego and lowers the offered load: keep it equal across compared runs
  ignore_traffic_lights: false
  ignore_stop_signs: false

  route:
    time_limit: 300
    origin: { x: 13.2, y: -318.7, z: 0.02, pitch: 0.002, yaw: 127.15, roll: 0.0 }
    destinations:
    - { x: -381.180145, y:  -1.711176, z: -0.003695 }
    - { x: -346.184967, y:  30.422617, z:  0.061665 }
    - { x: -320.524475, y:  33.792713, z:  0.321811 }
    - { x: -262.067322, y:  37.264809, z:  1.834885 }
    - { x:  241.204666, y: -246.428802, z: 0.004718 }
