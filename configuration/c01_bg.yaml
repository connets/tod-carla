# =============================================================================
#  c01 with the options added on dev_vannini (same coordinates, Town10HD_Opt):
#    agents[].loss_ratio_threshold, control_timeout, route_loop
#    new_vehicles[].destinations, route_loop
#    spectator.follow
# =============================================================================
world: Town10HD_Opt

new_vehicles:
- actor_id: Car01
  actor_type: Vehicle
  role_name: hero
  speed_limit: auto
  model: vehicle.tesla.model3
  camera:
    width: 1280
    height: 720
  renderCamera: false
  collision: true
  lidar: true

# background traffic: not teleoperated, but a 5G UE in OMNeT
- actor_id: Bg01
  actor_type: Vehicle
  role_name: other      # not hero: hero marks the ego
  speed_limit: auto
  model: vehicle.tesla.model3
  collision: false
  targetSpeed: 30
  route_loop: true
  origin:
    x: -24.085384
    y: 70.283424
    z: -0.003865
    pitch: 0.026931
    yaw: 0.0
    roll: 0.009131
  destinations:
  - x: -41.323059
    y: 47.269104
    z: 0.001971
  - x: -18.815849
    y: 65.878159
    z: 0.002049
  # back to the origin: closes the loop
  - x: -24.085384
    y: 70.283424
    z: 0.002049

spectator:
  follow: Car01         # chase camera instead of a fixed pose
  follow_distance: 8.0  # metres behind
  follow_height: 4.0    # metres above
  follow_pitch: -12.0

fromOmnet_vehicles: []

agents:
- agentId: Agent01
  behavior: aggressive
  sampling_resolution: 0.5
  time_limit: 50
  actor_id_to_control: Car01
  collision_calculation_method: TTC
  ignoreIds: [Bg01]

  loss_ratio_threshold: 0.5   # sensor loss that triggers the emergency stop
  control_timeout: 0.5        # seconds without instructions before the minimum risk maneuver
  route_loop: true            # restart the route instead of ending the simulation

  route:
    time_limit: 300
    origin:
      x: -12.158696174621582
      y: 66.13933563232422
      z: 0.0020429992582648993
      pitch: 0.00016392453107982874
      yaw: 179.766357421875
      roll: -6.103515261202119e-05
    destinations:
    - x: -18.815849
      y: 65.878159
      z: 0.002049
    - x: -41.323059
      y: 47.269104
      z: 0.001971
