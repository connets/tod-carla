# --- Traffico aggiuntivo: Bg04..Bg08 ------------------------------------------
#  Differenza da Bg01..Bg03: qui NON c'e' 'origin'. _generateVehicle spawna sempre
#  su random.choice(map.get_spawn_points()) e applica 'origin' solo dopo, come
#  ApplyTransform (MyActorManager.py:327-345): omettendolo si tiene la posa di
#  spawn di CARLA, che e' garantita valida su strada. Inventare x/y/yaw a mano
#  rischia invece di piazzare l'auto controsenso o contro un guard-rail.
#  Partono quindi sparsi per Town04 e confluiscono nell'area dell'ego seguendo le
#  loro destinazioni, che sono punti gia' validi ripresi dalle route esistenti.
#
#  ATTENZIONE: ogni actor_id qui DEVE avere il suo VectorTraffic[n].mobility.carla_id in
#  datagram_tod.ini, e numTrafficVehicles va tenuto allineato: un attore riportato
#  da CARLA senza modulo statico corrispondente viene creato dinamicamente da
#  OMNeT durante l'init, e questo rompe la mesh X2.
#
#  Il modello e' lo stesso dei Bg esistenti perche' e' l'unico gia' provato in
#  questo scenario: 'model' finisce in blueprint_library().filter(...) e un nome
#  inesistente farebbe fallire random.choice su lista vuota. Per varieta' visiva
#  si puo' allargare il filtro (es. vehicle.audi.*), verificando che esista.

- actor_id: Bg04
  actor_type: Vehicle
  role_name: other
  speed_limit: auto
  model: vehicle.tesla.model3
  collision: false
  targetSpeed: 30
  route_loop: true
  destinations:
