# =============================================================================
#  Town04 scene of DatagramTOD-Bg (tod-omnet/simulations/v2/datagram_tod.ini):
#  the ego of world_4_tod.yaml (keep the two aligned) plus background traffic.
#
#  Every actor_id must match a mobility.carla_id in datagram_tod.ini.
# =============================================================================
world: Town04_Opt

new_vehicles:

# --- Teleoperated ego (VectorVehicle[0]) ---------------------------------------
- actor_id: Car01
  actor_type: Vehicle
  role_name: hero
  speed_limit: auto
  model: vehicle.tesla.model3
  camera:
    width: 1280
    height: 720
  renderCamera: true      # camera window with the HUD; false for measurement campaigns
  collision: true
  lidar: true

# --- Background traffic: not teleoperated, but 5G UEs in OMNeT ------------------
#     role_name must not be hero (it marks the ego)
- actor_id: Bg01
  actor_type: Vehicle
  role_name: other
  speed_limit: auto
  model: vehicle.tesla.model3
  collision: false
  targetSpeed: 30
  route_loop: true
  origin: { x: 258.395355, y: -183.572708, z: 1.02, pitch: 0.0, yaw: -90.0, roll: 0.0 }
  destinations:
